<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Note Systems Vault — Testnet</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --border: #2a2a2a;
      --text: #f2f2f2;
      --text-dim: #9a9a9a;
      --accent: #f5a623;
      --green: #4caf50;
      --red: #e24b4a;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, system-ui, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .label { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    .value { font-size: 28px; font-weight: 600; margin-top: 4px; }
    .value-sub { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
    .row { display: flex; gap: 10px; margin-top: 16px; }
    button {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #1a1200; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    input {
      width: 100%;
      background: #1c1c1c;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      font-size: 16px;
      margin-top: 8px;
    }
    #status {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 12px;
      min-height: 18px;
    }
    #status.error { color: var(--red); }
    #status.success { color: var(--green); }
    .mandate { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
    #connectBtn { width: 100%; }
  </style>
  <script type="module" crossorigin src="/assets/index-CeVZuoOl.js"></script>
</head>
<body>
  <h1>Vault — Testnet</h1>
  <div class="subtitle">Robinhood Chain testnet · USDG vault</div>

  <div class="card" id="connectCard">
    <button id="connectBtn" class="btn-primary">Connect wallet</button>
  </div>

  <div class="card" id="balanceCard" style="display:none;">
    <div class="label">Your balance</div>
    <div class="value" id="balanceValue">0.00 USDG</div>
    <div class="value-sub" id="shareValue">0 shares</div>
  </div>

  <div class="card" id="mandateCard" style="display:none;">
    <div class="label">Vault mandate</div>
    <div class="mandate" id="mandateText">Loading…</div>
  </div>

  <div class="card" id="depositCard" style="display:none;">
    <div class="label">Deposit</div>
    <input id="depositAmount" type="number" placeholder="Amount in USDG" min="0" step="any" />
    <div class="row">
      <button id="depositBtn" class="btn-primary">Deposit</button>
    </div>
  </div>

  <div class="card" id="withdrawCard" style="display:none;">
    <div class="label">Withdraw</div>
    <input id="withdrawAmount" type="number" placeholder="Amount in shares" min="0" step="any" />
    <div class="row">
      <button id="withdrawBtn" class="btn-secondary">Request withdrawal</button>
    </div>
    <div class="value-sub" style="margin-top:10px;">New deposits are subject to a 24h exit lock. Coupons release into the share price gradually over 7 days.</div>
  </div>

  <div id="status"></div>

</body>
</html>
